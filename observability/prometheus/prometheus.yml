global:
    scrape_interval: 5s
    evaluation_interval: 5s

rule_files:
    - bidding-runtime-alerts.json

scrape_configs:
    # Target groups retain the existing job/runtime labels used by dashboards.
    # JSON file discovery also permits local port overrides without rewriting YAML.
    - job_name: "artgod-runtime"
      file_sd_configs:
          - files: ["targets.json"]
            refresh_interval: 5s
