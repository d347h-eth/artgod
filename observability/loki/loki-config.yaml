auth_enabled: false

server:
    http_listen_port: 42730

common:
    path_prefix: /loki
    replication_factor: 1
    ring:
        kvstore:
            store: inmemory

schema_config:
    configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
              prefix: index_
              period: 24h

storage_config:
    filesystem:
        directory: /loki/chunks

compactor:
    working_directory: /loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 168h
    retention_stream:
        - selector: '{level="debug"}'
          priority: 1
          period: 72h

analytics:
    reporting_enabled: false
