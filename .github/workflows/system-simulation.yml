name: System Simulation

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            campaign:
                description: Run the additional bounded causal campaign
                type: boolean
                default: false
    schedule:
        - cron: "17 3 * * *"

permissions:
    contents: read

concurrency:
    group: system-simulation-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    plan:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
                  package-manager-cache: false

            - name: Declare complete independent lanes
              id: matrix
              env:
                  INCLUDE_CAMPAIGNS: ${{ github.event_name == 'schedule' || inputs.campaign == true }}
              run: |
                  mkdir -p tmp
                  if [ "$INCLUDE_CAMPAIGNS" = "true" ]; then
                      node scripts/simulation/ci.mjs plan --campaign > tmp/simulation-ci-matrix.json
                  else
                      node scripts/simulation/ci.mjs plan > tmp/simulation-ci-matrix.json
                  fi
                  node --input-type=module <<'NODE'
                  import { appendFile, readFile } from "node:fs/promises";
                  const matrix = JSON.parse(await readFile("tmp/simulation-ci-matrix.json", "utf8"));
                  await appendFile(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
                  NODE

            - name: Retain the complete declared job set
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: system-simulation-matrix
                  retention-days: 7
                  if-no-files-found: warn
                  path: tmp/simulation-ci-matrix.json

    data-consistency:
        name: ${{ matrix.id }}
        needs: plan
        runs-on: ubuntu-24.04
        timeout-minutes: 180
        strategy:
            fail-fast: false
            max-parallel: 2
            matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
                  package-manager-cache: false

            - name: Enable Corepack
              run: corepack enable

            - name: Cache project dependencies
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      .yarn/cache
                      .yarn/unplugged
                  key: ${{ runner.os }}-simulation-yarn-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

            - name: Install workspace dependencies
              run: yarn install --immutable --mode=skip-build

            - name: Install ephemeral CI image and native build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y e2fsprogs file python3 make g++

            - name: Build trusted project SQLite binding
              run: |
                  mkdir -p tmp
                  TMPDIR="$PWD/tmp" yarn build:sqlite-native

            - name: Prepare saved emulator closure and immutable guest inputs
              id: inputs
              run: |
                  yarn node --input-type=module <<'NODE'
                  import { appendFile, readFile, writeFile } from "node:fs/promises";
                  import path from "node:path";
                  import { prepareToolCapsule, admitToolCapsule } from "./scripts/simulation/tool-capsule.mjs";
                  import { provisionInputs } from "./scripts/simulation/provision-inputs.mjs";
                  const tools = await prepareToolCapsule();
                  const capsule = await admitToolCapsule(tools.filename);
                  const input = await provisionInputs({ qemu: capsule.tools.qemu.path, qemuImg: capsule.tools.qemuImg.path, firmware: capsule.tools.firmware.path, scenarioFile: "scripts/simulation/scenarios/qualification.json" });
                  const configuration = JSON.parse(await readFile(input.buildConfigPath, "utf8"));
                  configuration.toolCapsuleFile = path.relative(input.directory, tools.filename);
                  const buildConfigPath = path.join(input.directory, "build-capsule.json");
                  await writeFile(buildConfigPath, JSON.stringify(configuration, null, 2) + "\n", { flag: "wx" });
                  await writeFile("tmp/simulation-ci-inputs.json", JSON.stringify({ ...input, buildConfigPath, toolCapsuleFile: tools.filename }, null, 2) + "\n");
                  await appendFile(process.env.GITHUB_OUTPUT, `build_config=${buildConfigPath}\n`);
                  NODE

            - name: Test workbench contracts and external world
              run: TMPDIR="$PWD/tmp" yarn simulation:test

            - name: Build one reusable production runtime guest
              id: build
              env:
                  BUILD_CONFIGURATION: ${{ steps.inputs.outputs.build_config }}
              run: |
                  yarn node --input-type=module <<'NODE'
                  import { appendFile } from "node:fs/promises";
                  import path from "node:path";
                  import { buildGuest } from "./scripts/simulation/build-guest.mjs";
                  const { run } = await buildGuest(process.env.BUILD_CONFIGURATION);
                  await appendFile(process.env.GITHUB_OUTPUT, `base_manifest=${path.join(run, "manifest.json")}\n`);
                  NODE

            - name: Qualify actual SQLite, NATS and machine replay
              id: substrate
              env:
                  BASE_MANIFEST: ${{ steps.build.outputs.base_manifest }}
              run: yarn node scripts/simulation/qemu-replay.mjs --manifest "$BASE_MANIFEST" --run

            - name: Run the declared bounded lane
              if: ${{ always() && steps.substrate.outcome == 'success' }}
              env:
                  SIMULATION_BASE_MANIFEST: ${{ steps.build.outputs.base_manifest }}
                  SIMULATION_CI_LANE: ${{ toJSON(matrix) }}
                  SIMULATION_CI_MATRIX: ${{ needs.plan.outputs.matrix }}
              run: yarn node scripts/simulation/ci.mjs run

            - name: Account for a lane blocked by guest qualification
              if: ${{ always() && steps.substrate.outcome != 'success' }}
              env:
                  SIMULATION_CI_LANE: ${{ toJSON(matrix) }}
                  SIMULATION_CI_MATRIX: ${{ needs.plan.outputs.matrix }}
                  SIMULATION_CI_BLOCKER: Guest build or machine qualification did not pass; build=${{ steps.build.outcome }}, substrate=${{ steps.substrate.outcome }}
              run: node scripts/simulation/ci.mjs blocked

            - name: Package bounded complete counterexamples
              if: always()
              run: yarn simulation export-failures --max-bundles 1

            - name: Retain synthetic reports and replay traces
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: system-simulation-evidence-${{ matrix.id }}
                  retention-days: 7
                  if-no-files-found: warn
                  path: |
                      tmp/simulation-ci-*.json
                      tmp/simulation-ci-lanes/lane-*/**
                      tmp/simulation-failed-exports/exports-*/index.json
                      tmp/simulation-regressions/regressions-*/cases.json
                      tmp/simulation-regressions/regressions-*/plan.json
                      tmp/simulation-regressions/regressions-*/scenario-*.json
                      tmp/simulation-regressions/regressions-*/report.json
                      tmp/simulation-campaigns/campaign-*/plan.json
                      tmp/simulation-campaigns/campaign-*/executions.json
                      tmp/simulation-campaigns/campaign-*/report.json
                      tmp/simulation-campaigns/campaign-*/casefiles.json
                      tmp/simulation-inputs/inputs-*/build.json
                      tmp/simulation-inputs/inputs-*/build-capsule.json
                      tmp/simulation-inputs/inputs-*/provenance.json
                      tmp/simulation-inputs/inputs-*/logs/*.log
                      tmp/simulation-inputs/inputs-*/containers/container-*/container.json
                      tmp/simulation-inputs/inputs-*/containers/container-*/*.stdout
                      tmp/simulation-inputs/inputs-*/containers/container-*/*.stderr
                      tmp/simulation-docker/container-*/container.json
                      tmp/simulation-docker/container-*/*.stdout
                      tmp/simulation-docker/container-*/*.stderr
                      tmp/simulation/guest-*/manifest.json
                      tmp/simulation/guest-*/provenance.json
                      tmp/simulation/guest-*/logs/*.log
                      tmp/simulation/guest-*/logs/*.log.stdout
                      tmp/simulation-cases/case-*/manifest.json
                      tmp/simulation-cases/case-*/input/payload/scenario.json
                      tmp/simulation-qemu/run-*/report.json
                      tmp/simulation-qemu/run-*/input-manifest.json
                      tmp/simulation-qemu/run-*/*-command.json
                      tmp/simulation-qemu/run-*/*-serial.log
                      tmp/simulation-qemu/run-*/*-qemu.log
                      tmp/simulation-qemu/run-*/replay.bin

            - name: Retain exact synthetic guest images for failures
              if: ${{ failure() || cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: system-simulation-failed-guest-${{ matrix.id }}
                  retention-days: 3
                  if-no-files-found: warn
                  compression-level: 0
                  path: |
                      tmp/simulation/guest-*/guest.qcow2
                      tmp/simulation/guest-*/scenario-input/scenario.ext4
                      tmp/simulation-cases/case-*/input/scenario.ext4
                      tmp/simulation-qemu/run-*/record.qcow2
                      tmp/simulation-qemu/run-*/replay.qcow2
                      tmp/simulation-inputs/inputs-*/kernel
                      tmp/simulation-inputs/inputs-*/nats-server
                      tmp/simulation-tools/tools-*/tool-capsule.json
                      tmp/simulation-tools/tools-*/tool-image.tar
                      tmp/simulation-tools/tools-*/qemu-system-x86_64
                      tmp/simulation-tools/tools-*/qemu-img
                      tmp/simulation-tools/tools-*/qboot.rom
                      tmp/simulation-failed-exports/exports-*/bundles/**
