name: Dependency Security Check

on:
    pull_request:
        paths:
            - ".github/workflows/dependency-security-check.yml"
            - ".yarnrc.yml"
            - "config/cargo-age-gate.json"
            - "scripts/build/pinned-build-inputs*.mjs"
            - "scripts/security/patched-dependencies.test.mjs"
            - ".yarn/patches/**"
            - "package.json"
            - "scripts/security/cargo-*.mjs"
            - "scripts/build/cargo-projects.mjs"
            - "src-tauri/Cargo.lock"
            - "src-tauri/Cargo.toml"
            - "src-tauri/**/Cargo.lock"
            - "src-tauri/**/Cargo.toml"
            - "yarn.lock"
            - "*/package.json"
    push:
        branches:
            - main
        paths:
            - ".github/workflows/dependency-security-check.yml"
            - ".yarnrc.yml"
            - "config/cargo-age-gate.json"
            - "scripts/build/pinned-build-inputs*.mjs"
            - "scripts/security/patched-dependencies.test.mjs"
            - ".yarn/patches/**"
            - "package.json"
            - "scripts/security/cargo-*.mjs"
            - "scripts/build/cargo-projects.mjs"
            - "src-tauri/Cargo.lock"
            - "src-tauri/Cargo.toml"
            - "src-tauri/**/Cargo.lock"
            - "src-tauri/**/Cargo.toml"
            - "yarn.lock"
            - "*/package.json"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    yarn-security:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
                  package-manager-cache: false

            - name: Enable Corepack
              run: corepack enable

            - name: Cache Yarn local artifacts
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: |
                      .yarn/cache
                      .yarn/unplugged
                  key: ${{ runner.os }}-yarn-security-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-security-

            - name: Prepare Yarn project state for security aliases
              run: yarn install --immutable --mode=skip-build

            - name: Verify Yarn lockfile metadata
              run: yarn security:yarn:verify-lockfile

            - name: Audit Node dependency advisories
              run: yarn security:yarn:test-patches && yarn security:yarn:audit

    cargo-age-gate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
                  package-manager-cache: false

            - name: Enable Corepack
              run: corepack enable

            - name: Prepare Yarn project state for security aliases
              run: yarn install --immutable --mode=skip-build

            - name: Check Cargo dependency age gate
              run: yarn cargo:age-gate

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
              with:
                  toolchain: 1.93.1

            - name: Check enabled Cargo cryptography
              run: node ./scripts/security/cargo-crypto-security.test.mjs && yarn cargo:crypto-check
