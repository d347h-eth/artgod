name: Tauri Build Check

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    tauri-check:
        runs-on: ubuntu-22.04

        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24.3.0

            - name: Enable Corepack
              run: corepack enable

            - name: Check project version consistency
              run: node ./scripts/build/sync-version.mjs --check

            - name: Check documentation contracts
              run: |
                  node --test ./scripts/docs/verify-documentation.test.mjs
                  node ./scripts/docs/verify-documentation.mjs

            - name: Cache Yarn local artifacts
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      .yarn/cache
                      .yarn/unplugged
                      .cache/desktop-node-runtime
                      .cache/desktop-nats-runtime
                  key: ${{ runner.os }}-yarn-local-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-local-

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
              with:
                  toolchain: 1.93.1

            - name: Install Linux build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev \
                      libgtk-3-dev \
                      libayatana-appindicator3-dev \
                      librsvg2-dev \
                      libfuse2 \
                      libssl-dev \
                      libxdo-dev \
                      patchelf \
                      squashfs-tools \
                      file \
                      xdg-utils \
                      python3 \
                      make \
                      g++

            - name: Install workspace dependencies
              run: yarn install --immutable

            - name: Test Linux desktop build prerequisites
              run: yarn check:linux-release-build --phase prerequisites

            - name: Verify Linux no-bundle build
              run: yarn check:linux-release-build --phase no-bundle

            - name: Build and verify Linux bundles
              run: yarn check:linux-release-build --phase bundle

    macos-prompt-containment-check:
        runs-on: macos-latest

        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: package.json

            - name: Enable Corepack
              run: corepack enable

            - name: Cache Yarn local artifacts
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      .yarn/cache
                      .yarn/unplugged
                      .cache/desktop-node-runtime
                      .cache/desktop-nats-runtime
                  key: ${{ runner.os }}-yarn-local-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-local-

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
              with:
                  toolchain: 1.93.1
                  targets: aarch64-apple-darwin,x86_64-apple-darwin

            - name: Install workspace dependencies
              run: yarn install --immutable --mode=skip-build

            - name: Build universal macOS SQLite dependency
              run: yarn node ./scripts/build/verify-macos-universal-sqlite-build.mjs

            - name: Fetch macOS root Cargo dependencies
              run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked

            - name: Test desktop listener boundaries
              run: yarn test:desktop:listener-boundaries

            - name: Build macOS userland frontend
              run: yarn build:userland

            - name: Build macOS desktop runtime
              run: yarn build:desktop-runtime

            - name: Stage macOS desktop runtime resources
              run: yarn build:desktop-runtime-resources

            - name: Verify staged desktop runtime resources
              run: yarn check:desktop-runtime-resources

            - name: Prepare macOS secret prompt sidecar
              run: node ./scripts/build/prepare-desktop-sidecars.mjs --profile debug

            - name: Test secret prompt parent containment
              run: yarn test:desktop:secret-prompt-parent-containment

            - name: Build unsigned universal macOS DMG
              env:
                  DESKTOP_NODE_DIST_TARGET: darwin-universal
                  DESKTOP_NATS_DIST_TARGET: darwin-universal
              run: yarn node ./scripts/build/build-tauri.mjs --ci --target universal-apple-darwin --bundles dmg --no-sign

            - name: Verify unsigned universal macOS DMG contents
              run: node ./scripts/build/macos-code-signing.mjs verify-unsigned-dmg "src-tauri/target/universal-apple-darwin/release/bundle/dmg" "src-tauri/target"

    windows-containment-check:
        runs-on: windows-latest
        env:
            CARGO_BUILD_TARGET: x86_64-pc-windows-msvc

        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: package.json

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-10
              with:
                  toolchain: 1.93.1
                  targets: ${{ env.CARGO_BUILD_TARGET }}

            - name: Install workspace dependencies
              run: yarn install --immutable --mode=skip-build

            - name: Test Windows package-manager and Tauri launchers
              run: yarn node --test ./scripts/build/project-yarn-command.test.mjs ./scripts/build/frontend-dev-process-tree.test.mjs ./scripts/build/build-tauri.test.mjs

            - name: Build trusted native SQLite dependency
              run: yarn build:sqlite-native

            - name: Build Windows userland frontend
              run: yarn build:userland

            - name: Prepare Windows secret prompt sidecar
              run: node ./scripts/build/prepare-desktop-sidecars.mjs --profile debug

            - name: Check Windows sensitive-process hardening
              run: cargo check --manifest-path src-tauri/Cargo.toml --locked --lib
